services:
  site:
    build: .
    image: personal-site
    restart: unless-stopped
    # No "ports:" on purpose: the site is only reachable by cloudflared on the internal network,
    # and being only on that network means it has no internet access either
    networks: [tunnel]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [site]
    # tunnel to reach the site, egress to reach Cloudflare
    networks: [tunnel, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  tunnel:
    internal: true
  egress:
